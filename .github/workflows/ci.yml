name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        run: |
          set -euo pipefail
          # Show YAPF version for reproducibility
          python -m yapf --version || true
          # Produce a unified diff to stdout and into a file
          python -m yapf -r --diff src tests | tee yapf.diff
          # If diff file is non-empty, fail the job and print guidance
          if [ -s yapf.diff ]; then
            echo "\n\n❌ Code formatting differences detected by YAPF."
            echo "Run locally to fix: python -m yapf -r --in-place src tests"
            exit 1
          fi

      - name: Run tests
        run: pytest
